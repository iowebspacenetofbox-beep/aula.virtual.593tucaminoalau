<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula Virtual</title>
    <!-- Tailwind CSS (Carga estática) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <!-- Contenedor Principal -->
    <div class="flex h-screen overflow-hidden">

        <!-- Menú Lateral (Sidebar) -->
        <aside class="w-64 bg-slate-900 text-white flex-shrink-0 hidden md:flex flex-col">
            <div class="p-6">
                <h2 class="text-2xl font-bold tracking-tight"><i class="fa-solid fa-graduation-cap mr-2"></i>Plataforma</h2>
                <p class="text-slate-400 text-sm mt-1">Aula Virtual</p>
            </div>
            <nav class="flex-1 px-4 space-y-2">
                <a href="#" class="flex items-center gap-3 bg-slate-800 text-white px-4 py-3 rounded-lg transition">
                    <i class="fa-solid fa-house"></i> Panel Principal
                </a>
                <a href="#" class="flex items-center gap-3 text-slate-300 hover:bg-slate-800 hover:text-white px-4 py-3 rounded-lg transition">
                    <i class="fa-solid fa-book"></i> Cursos
                </a>
                <a href="#" class="flex items-center gap-3 text-slate-300 hover:bg-slate-800 hover:text-white px-4 py-3 rounded-lg transition">
                    <i class="fa-solid fa-stopwatch"></i> Evaluaciones
                </a>
                <a href="#" class="flex items-center gap-3 text-slate-300 hover:bg-slate-800 hover:text-white px-4 py-3 rounded-lg transition">
                    <i class="fa-solid fa-chart-line"></i> Progreso
                </a>
            </nav>
            <div class="p-4 border-t border-slate-800">
                <!-- BOTÓN DE LOGOUT CON SU ID -->
                <a href="#" id="btn-logout" class="flex items-center gap-3 text-slate-300 hover:text-white transition">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Cerrar Sesión
                </a>
            </div>
        </aside>

        <!-- Área de Contenido Principal -->
        <main class="flex-1 flex flex-col overflow-y-auto">
            
            <!-- Encabezado superior -->
            <header class="bg-white shadow-sm border-b border-gray-200 px-6 py-4 flex items-center justify-between sticky top-0 z-10">
                <div class="flex items-center gap-4">
                    <!-- Botón menú móvil -->
                    <button class="md:hidden text-gray-500 hover:text-blue-600 text-xl">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <h1 class="text-xl font-semibold text-gray-800">Hola, Estudiante 👋</h1>
                </div>
                <div class="flex items-center gap-4">
                    <button class="text-gray-400 hover:text-blue-600 transition relative">
                        <i class="fa-regular fa-bell text-xl"></i>
                        <span class="absolute top-0 right-0 -mt-1 -mr-1 bg-red-500 w-3 h-3 rounded-full border-2 border-white"></span>
                    </button>
                    <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold border border-blue-200">
                        E
                    </div>
                </div>
            </header>

            <!-- Contenedor Vacío para el Futuro Dashboard -->
            <div class="p-6 max-w-7xl mx-auto w-full space-y-8 flex-1 flex items-center justify-center">
                
                <div class="text-center text-gray-400">
                    <i class="fa-solid fa-hammer text-4xl mb-3 text-gray-300"></i>
                    <h2 class="text-lg font-medium text-gray-500">Área de Trabajo</h2>
                    <p class="text-sm">El contenido dinámico se cargará aquí.</p>
                </div>

            </div>
        </main>
    </div>

    <!-- SCRIPT DE FIREBASE: PROTECCIÓN Y CIERRE DE SESIÓN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // Tu configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAYCa2kTBQYlqfV7yV_0mQKmZDj7QBCxmA",
            authDomain: "aulavirtual-c5c0f.firebaseapp.com",
            projectId: "aulavirtual-c5c0f",
            storageBucket: "aulavirtual-c5c0f.firebasestorage.app",
            messagingSenderId: "708093806084",
            appId: "1:708093806084:web:f7b0f091923b958cda9751"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // 1. Proteger la ruta: Si nadie ha iniciado sesión, expulsar a index.html
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                // Reemplazamos la ruta para que no puedan usar el botón "Atrás" del navegador
                window.location.replace("index.html"); 
            }
        });

        // 2. Lógica del Botón "Cerrar Sesión"
        const btnLogout = document.getElementById('btn-logout');
        if (btnLogout) {
            btnLogout.addEventListener('click', (e) => {
                e.preventDefault(); // Evita que salte hacia arriba la página
                signOut(auth).then(() => {
                    // Éxito al cerrar sesión, Firebase disparará el onAuthStateChanged y lo enviará al index
                    window.location.replace("index.html");
                }).catch((error) => {
                    console.error("Error al cerrar sesión:", error);
                });
            });
        }
    </script>
</body>
</html>
