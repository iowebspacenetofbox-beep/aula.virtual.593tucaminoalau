<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Aula Virtual</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen font-sans antialiased">

    <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-200 w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-slate-900 text-white rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-800">Bienvenido</h2>
            <p class="text-gray-500 text-sm mt-1">Ingresa tus credenciales para continuar</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
                <input type="email" id="email" required 
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                       placeholder="estudiante@correo.com">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <input type="password" id="password" required 
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                       placeholder="••••••••">
            </div>
            
            <!-- Mensaje de error oculto por defecto -->
            <div id="error-message" class="hidden bg-red-50 text-red-600 text-sm p-3 rounded-lg border border-red-100">
                <i class="fa-solid fa-circle-exclamation mr-1"></i> Credenciales incorrectas.
            </div>

            <button type="submit" id="submitBtn" 
                    class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 rounded-lg transition duration-200 shadow-md">
                Iniciar Sesión
            </button>
        </form>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        // Importar Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // Tu configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAYCa2kTBQYlqfV7yV_0mQKmZDj7QBCxmA",
            authDomain: "aulavirtual-c5c0f.firebaseapp.com",
            projectId: "aulavirtual-c5c0f",
            storageBucket: "aulavirtual-c5c0f.firebasestorage.app",
            messagingSenderId: "708093806084",
            appId: "1:708093806084:web:f7b0f091923b958cda9751"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Lógica del formulario
        const loginForm = document.getElementById('loginForm');
        const errorMsg = document.getElementById('error-message');
        const submitBtn = document.getElementById('submitBtn');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault(); // Evita que la página se recargue
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Estado de carga
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Validando...';
            submitBtn.disabled = true;

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // ¡Éxito! Redirigir al aula virtual
                    window.location.href = "aulavirtual.html";
                })
                .catch((error) => {
                    // Mostrar error
                    errorMsg.classList.remove('hidden');
                    submitBtn.innerHTML = 'Iniciar Sesión';
                    submitBtn.disabled = false;
                });
        });
    </script>
</body>
</html>
