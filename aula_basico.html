<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula | Curso Básico de Probióticos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans antialiased flex h-screen overflow-hidden">

    <!-- Panel Izquierdo (Sidebar) -->
    <aside class="w-72 bg-emerald-900 text-white flex-shrink-0 flex flex-col z-20 shadow-xl">
        <div class="p-6 border-b border-emerald-800">
            <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider">Nivel Básico</span>
            <h2 class="text-xl font-bold text-white mt-1">Probióticos</h2>
        </div>
        
        <!-- Menú de Navegación -->
        <nav class="flex-1 overflow-y-auto p-4 space-y-2">
            
            <div class="text-xs font-semibold text-emerald-300 uppercase tracking-wider mb-2 mt-4 px-2">Contenido</div>
            
            <a href="#" class="flex items-center gap-3 bg-emerald-800 text-white px-4 py-3 rounded-xl transition">
                <i class="fa-solid fa-person-chalkboard w-5"></i> Clases
            </a>
            
            <a href="#" class="flex items-center gap-3 hover:bg-emerald-800 text-emerald-100 px-4 py-3 rounded-xl transition">
                <i class="fa-solid fa-folder-open w-5"></i> Material de Apoyo
            </a>
            
            <a href="#" class="flex items-center gap-3 hover:bg-emerald-800 text-emerald-100 px-4 py-3 rounded-xl transition">
                <i class="fa-solid fa-clipboard-question w-5"></i> Evaluaciones
            </a>

            <div class="text-xs font-semibold text-emerald-300 uppercase tracking-wider mb-2 mt-6 px-2">General</div>

            <a href="#" class="flex items-center gap-3 hover:bg-emerald-800 text-emerald-100 px-4 py-3 rounded-xl transition">
                <i class="fa-solid fa-certificate w-5"></i> Certificado
            </a>
        </nav>
        
        <div class="p-4 border-t border-emerald-800">
            <button id="btn-logout" class="w-full flex items-center justify-center gap-2 bg-emerald-800 hover:bg-red-600 text-white font-semibold py-3 rounded-xl transition">
                <i class="fa-solid fa-power-off"></i> Cerrar Sesión
            </button>
        </div>
    </aside>

    <!-- Área Principal (Lienzo en blanco) -->
    <main class="flex-1 flex flex-col overflow-y-auto bg-slate-50">
        
        <!-- Cabecera simple -->
        <header class="bg-white px-8 py-4 flex items-center justify-between shadow-sm sticky top-0 z-10 border-b border-slate-200">
            <h1 class="text-xl font-bold text-slate-800">Clases</h1>
            <div class="flex items-center gap-4">
                <span class="text-sm font-medium text-slate-600">Estudiante</span>
                <div class="w-10 h-10 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center font-bold">
                    E
                </div>
            </div>
        </header>

        <!-- CONTENEDOR EN BLANCO PARA IR AÑADIENDO COSAS -->
        <div class="p-8 w-full flex-1">
            
            <div class="bg-white border border-slate-200 border-dashed rounded-2xl h-full min-h-[400px] flex flex-col items-center justify-center text-slate-400">
                <i class="fa-solid fa-plus-circle text-4xl mb-3 text-slate-300"></i>
                <p>El contenido de Clases / Material de apoyo irá aquí</p>
            </div>

        </div>
    </main>

    <!-- Script de Protección Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // CONFIGURACIÓN CURSO BÁSICO (LA TUYA)
        const firebaseConfig = {
            apiKey: "AIzaSyAYCa2kTBQYlqfV7yV_0mQKmZDj7QBCxmA",
            authDomain: "aulavirtual-c5c0f.firebaseapp.com",
            projectId: "aulavirtual-c5c0f",
            storageBucket: "aulavirtual-c5c0f.firebasestorage.app",
            messagingSenderId: "708093806084",
            appId: "1:708093806084:web:f7b0f091923b958cda9751"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Proteger la ruta: si no está logueado, vuelve al login de ESTE curso
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.replace("login_basico.html"); 
            }
        });

        // Lógica de Cerrar Sesión
        document.getElementById('btn-logout').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.replace("login_basico.html");
            });
        });
    </script>
</body>
</html>
