<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Curso Básico de Probióticos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 h-screen flex">

    <!-- Lado Izquierdo: Formulario -->
    <div class="w-full lg:w-1/2 flex items-center justify-center p-8 bg-white shadow-2xl z-10">
        <div class="max-w-md w-full">
            <a href="index.html" class="text-sm text-slate-500 hover:text-slate-800 mb-8 inline-block transition">
                <i class="fa-solid fa-arrow-left mr-2"></i> Volver al catálogo
            </a>
            
            <div class="mb-10">
                <span class="text-xs font-bold text-emerald-600 bg-emerald-100 px-3 py-1 rounded-full mb-4 inline-block">Nivel Básico</span>
                <h2 class="text-3xl font-extrabold text-slate-900 mt-2">Bienvenido de nuevo</h2>
                <p class="text-slate-500 mt-2">Ingresa a tu curso de Elaboración de Probióticos.</p>
            </div>

            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Correo Electrónico</label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-4 top-3.5 text-slate-400"></i>
                        <input type="email" id="email" required 
                               class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition"
                               placeholder="tu@correo.com">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Contraseña</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-400"></i>
                        <input type="password" id="password" required 
                               class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition"
                               placeholder="••••••••">
                    </div>
                </div>
                
                <div id="error-message" class="hidden bg-red-50 text-red-600 text-sm p-4 rounded-xl border border-red-100 flex items-center">
                    <i class="fa-solid fa-circle-exclamation mr-2 text-lg"></i> Acceso denegado. Verifica tus datos.
                </div>

                <button type="submit" id="submitBtn" 
                        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl transition duration-300 shadow-lg shadow-emerald-200">
                    Iniciar Sesión
                </button>
            </form>
        </div>
    </div>

    <!-- Lado Derecho: Imagen/Diseño (Oculto en móviles) -->
    <div class="hidden lg:flex w-1/2 bg-slate-900 items-center justify-center relative overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-br from-emerald-600/20 to-slate-900 z-10"></div>
        <img src="https://images.unsplash.com/photo-1532094349884-543bc11b234d?auto=format&fit=crop&q=80" alt="Ciencia" class="absolute inset-0 w-full h-full object-cover opacity-50">
        <div class="relative z-20 text-center p-12 max-w-lg">
            <i class="fa-solid fa-flask text-6xl text-emerald-400 mb-6 drop-shadow-lg"></i>
            <h3 class="text-3xl font-bold text-white mb-4">La ciencia en tus manos</h3>
            <p class="text-slate-300 text-lg">Descubre los secretos de la fermentación y mejora la salud con probióticos elaborados profesionalmente.</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // *** AQUI VA LA CONFIGURACIÓN. ESTA ES LA TUYA DEL CURSO BÁSICO ***
        // PARA LOS OTROS CURSOS, SOLO CAMBIA ESTAS LÍNEAS
        const firebaseConfig = {
            apiKey: "AIzaSyAYCa2kTBQYlqfV7yV_0mQKmZDj7QBCxmA",
            authDomain: "aulavirtual-c5c0f.firebaseapp.com",
            projectId: "aulavirtual-c5c0f",
            storageBucket: "aulavirtual-c5c0f.firebasestorage.app",
            messagingSenderId: "708093806084",
            appId: "1:708093806084:web:f7b0f091923b958cda9751"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Conectando...';
            
            signInWithEmailAndPassword(auth, email, password)
                .then(() => {
                    // Redirige al aula del curso básico
                    window.location.href = "aula_basico.html"; 
                })
                .catch(() => {
                    document.getElementById('error-message').classList.remove('hidden');
                    submitBtn.innerHTML = 'Iniciar Sesión';
                });
        });
    </script>
</body>
</html>
